services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finsec_seal}
      POSTGRES_USER: ${POSTGRES_USER:-finsec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finsec-local}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finsec} -d ${POSTGRES_DB:-finsec_seal}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - finsec-postgres:/var/lib/postgresql/data

  backend:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-finsec_seal}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-finsec}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-finsec-local}
      FINSEC_AI_ENABLED: ${FINSEC_AI_ENABLED:-false}
      FINSEC_AI_BASE_URL: ${FINSEC_AI_BASE_URL:-http://host.docker.internal:8001}
      FINSEC_AI_CONNECT_TIMEOUT: ${FINSEC_AI_CONNECT_TIMEOUT:-2s}
      FINSEC_AI_REQUEST_TIMEOUT: ${FINSEC_AI_REQUEST_TIMEOUT:-5s}
      FINSEC_GENERATION_WORKER_ENABLED: ${FINSEC_GENERATION_WORKER_ENABLED:-true}
      FINSEC_GENERATION_POLL_MS: ${FINSEC_GENERATION_POLL_MS:-1000}
      FINSEC_GENERATION_LEASE_SECONDS: ${FINSEC_GENERATION_LEASE_SECONDS:-180}
      FINSEC_CORS_ALLOWED_ORIGINS: ${FINSEC_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      FINSEC_DATA_ENCRYPTION_KEY_BASE64: ${FINSEC_DATA_ENCRYPTION_KEY_BASE64:-}
      FINSEC_CONTRACT_ACCESS_KEY: ${FINSEC_CONTRACT_ACCESS_KEY:-}
      FINSEC_CONTRACT_ACCESS_ACTOR: ${FINSEC_CONTRACT_ACCESS_ACTOR:-}
      FINSEC_CONTRACT_ACCESS_WORKSPACE: ${FINSEC_CONTRACT_ACCESS_WORKSPACE:-}
      FINSEC_IDEMPOTENCY_RECOVERY_KEY: ${FINSEC_IDEMPOTENCY_RECOVERY_KEY:-}
      FINSEC_IDEMPOTENCY_INSTANCE_STALE_AFTER: ${FINSEC_IDEMPOTENCY_INSTANCE_STALE_AFTER:-30s}
      FINSEC_IDEMPOTENCY_INSTANCE_HEARTBEAT_MS: ${FINSEC_IDEMPOTENCY_INSTANCE_HEARTBEAT_MS:-5000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  finsec-postgres:
