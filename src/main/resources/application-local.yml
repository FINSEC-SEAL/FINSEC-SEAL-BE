spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finsec_seal}
    username: ${SPRING_DATASOURCE_USERNAME:finsec}
    password: ${SPRING_DATASOURCE_PASSWORD:finsec-local}

finsec:
  cors:
    allowed-origins: ${FINSEC_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  crypto:
    # 개발 편의용 기본 키(로컬에서만 사용). 실제 배포에서는 환경변수로 설정하세요.
    key-base64: ${FINSEC_DATA_ENCRYPTION_KEY_BASE64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  idempotency:
    recovery-key: ${FINSEC_IDEMPOTENCY_RECOVERY_KEY:}
