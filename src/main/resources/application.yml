spring:
  application:
    name: finsec-seal-be
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

finsec:
  scheduling:
    enabled: ${FINSEC_SCHEDULING_ENABLED:true}
  cors:
    allowed-origins: ${FINSEC_CORS_ALLOWED_ORIGINS}
  crypto:
    key-base64: ${FINSEC_DATA_ENCRYPTION_KEY_BASE64}
  idempotency:
    ttl: ${FINSEC_IDEMPOTENCY_TTL:24h}
    recovery-key: ${FINSEC_IDEMPOTENCY_RECOVERY_KEY:}
  sse:
    timeout: 30m
    heartbeat: 15s
